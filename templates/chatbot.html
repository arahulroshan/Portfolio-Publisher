<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Portfolio Assistant</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(124, 58, 237, 0.18),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(192, 38, 211, 0.15),
                    transparent 30%
                ),

                #050509;

            color: white;

            font-family: Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        /* ================= CHAT CONTAINER ================= */

        .chat-container {

            width: 100%;

            max-width: 750px;

            background: rgba(13, 11, 24, 0.95);

            border: 1px solid #8b5cf6;

            border-radius: 22px;

            box-shadow:

                0 0 20px #8b5cf6,

                0 0 50px rgba(139, 92, 246, 0.35),

                0 0 100px rgba(192, 38, 211, 0.15);

            overflow: hidden;
        }


        /* ================= HEADER ================= */

        .chat-header {

            padding: 25px;

            text-align: center;

            background:

                linear-gradient(
                    135deg,
                    #7c3aed,
                    #c026d3
                );

            box-shadow:

                0 0 25px rgba(139, 92, 246, 0.5);
        }


        .chat-header h2 {

            margin: 0;

            font-size: 26px;
        }


        .chat-header p {

            margin: 8px 0 0;

            opacity: 0.9;

            font-size: 14px;
        }


        /* ================= MESSAGES ================= */

        .messages {

            height: 450px;

            overflow-y: auto;

            padding: 25px;
        }


        .message {

            margin: 14px 0;

            padding: 13px 17px;

            border-radius: 14px;

            max-width: 82%;

            line-height: 1.5;

            word-wrap: break-word;
        }


        /* BOT */

        .bot {

            background: #18132b;

            border: 1px solid #8b5cf6;

            box-shadow:

                0 0 10px rgba(139, 92, 246, 0.15);

            margin-right: auto;
        }


        /* USER */

        .user {

            background:

                linear-gradient(
                    135deg,
                    #7c3aed,
                    #9333ea
                );

            margin-left: auto;

            box-shadow:

                0 0 12px rgba(124, 58, 237, 0.3);
        }


        /* ================= INPUT AREA ================= */

        .input-area {

            display: flex;

            padding: 18px;

            gap: 12px;

            border-top:

                1px solid #29213f;

            background: #090712;
        }


        .input-area input {

            flex: 1;

            padding: 15px;

            border-radius: 12px;

            border: 1px solid #8b5cf6;

            background: #080612;

            color: white;

            outline: none;

            font-size: 15px;
        }


        .input-area input:focus {

            box-shadow:

                0 0 12px rgba(139, 92, 246, 0.5);
        }


        .input-area button {

            padding: 15px 24px;

            border: none;

            border-radius: 12px;

            background:

                linear-gradient(
                    135deg,
                    #7c3aed,
                    #c026d3
                );

            color: white;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;

            transition: 0.3s;
        }


        .input-area button:hover {

            transform: translateY(-2px);

            box-shadow:

                0 0 18px #8b5cf6;
        }


        /* ================= SCROLLBAR ================= */

        .messages::-webkit-scrollbar {

            width: 7px;
        }


        .messages::-webkit-scrollbar-track {

            background: #080612;
        }


        .messages::-webkit-scrollbar-thumb {

            background: #8b5cf6;

            border-radius: 10px;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            body {

                padding: 10px;
            }


            .chat-header h2 {

                font-size: 21px;
            }


            .messages {

                height: 420px;

                padding: 15px;
            }


            .message {

                max-width: 90%;
            }


            .input-area {

                padding: 12px;
            }


            .input-area button {

                padding: 12px 16px;
            }

        }

    </style>

</head>


<body>


<div class="chat-container">


    <!-- ================= HEADER ================= -->

    <div class="chat-header">

        <h2>
            🤖 AI Portfolio Assistant
        </h2>

        <p>
            Ask me about this portfolio
        </p>

    </div>



    <!-- ================= CHAT MESSAGES ================= -->

    <div
        class="messages"
        id="messages"
    >

        <div class="message bot">

            👋 Hi! I'm the AI Portfolio Assistant.

            <br><br>

            You can ask me about:

            <br>

            • Skills

            <br>

            • Projects

            <br>

            • Education

            <br>

            • Experience

            <br>

            • Certificates

        </div>

    </div>



    <!-- ================= INPUT ================= -->

    <div class="input-area">

        <input
            type="text"
            id="userMessage"
            placeholder="Ask something..."
            autocomplete="off"
        >

        <button
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>


</div>



<!-- ================= JAVASCRIPT ================= -->

<script>


async function sendMessage() {


    const input =
        document.getElementById("userMessage");


    const messages =
        document.getElementById("messages");


    const message =
        input.value.trim();


    /* EMPTY MESSAGE */

    if (message === "") {

        return;

    }



    /* ================= USER MESSAGE ================= */

    const userMessage =
        document.createElement("div");


    userMessage.className =
        "message user";


    userMessage.innerText =
        message;


    messages.appendChild(
        userMessage
    );


    input.value = "";


    messages.scrollTop =
        messages.scrollHeight;



    /* ================= THINKING ================= */

    const botMessage =
        document.createElement("div");


    botMessage.className =
        "message bot";


    botMessage.innerText =
        "🤖 Thinking...";


    messages.appendChild(
        botMessage
    );


    messages.scrollTop =
        messages.scrollHeight;



    /* ================= SEND TO FLASK ================= */

    try {


        const response =
            await fetch(
                "/ai-chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message

                        })

                }
            );



        /* CHECK SERVER RESPONSE */

        if (!response.ok) {

            throw new Error(
                "Server error: " +
                response.status
            );

        }



        const data =
            await response.json();



        /* ================= AI RESPONSE ================= */

        botMessage.innerText =
            data.reply ||
            "Sorry, I couldn't generate a response.";


    }


    catch (error) {


        console.error(
            "Chat error:",
            error
        );


        botMessage.innerText =
            "❌ Sorry, something went wrong while connecting to the AI.";

    }



    messages.scrollTop =
        messages.scrollHeight;

}



/* ================= ENTER KEY ================= */

document
    .getElementById("userMessage")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                sendMessage();

            }

        }
    );


</script>


</body>

</html>
