<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Portfolio Assistant</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(124, 58, 237, 0.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(192, 38, 211, 0.15),
            transparent 30%
        ),
        #050509;

    color: white;

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;
}


/* ================= MAIN APP ================= */

.app-container {

    width: 100%;

    max-width: 1100px;

    height: 700px;

    display: flex;

    background: rgba(13, 11, 24, 0.97);

    border: 1px solid #8b5cf6;

    border-radius: 22px;

    overflow: hidden;

    box-shadow:
        0 0 20px #8b5cf6,
        0 0 50px rgba(139, 92, 246, 0.35),
        0 0 100px rgba(192, 38, 211, 0.15);
}


/* ================= SIDEBAR ================= */

.sidebar {

    width: 260px;

    background: #090712;

    border-right: 1px solid #29213f;

    display: flex;

    flex-direction: column;
}


.sidebar-header {

    padding: 20px;

    border-bottom: 1px solid #29213f;
}


.sidebar-header h3 {

    margin: 0 0 15px;

    color: #d8b4fe;

    font-size: 18px;
}


.new-chat {

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #c026d3
        );

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}


.new-chat:hover {

    box-shadow: 0 0 15px #8b5cf6;

    transform: translateY(-1px);
}


/* ================= CHAT LIST ================= */

.chat-list {

    flex: 1;

    overflow-y: auto;

    padding: 10px;
}


.chat-item {

    padding: 12px;

    margin-bottom: 7px;

    border-radius: 10px;

    cursor: pointer;

    color: #ddd;

    font-size: 14px;

    transition: 0.2s;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.chat-item:hover {

    background: #18132b;

    color: white;
}


.chat-item.active {

    background:
        linear-gradient(
            135deg,
            rgba(124, 58, 237, 0.35),
            rgba(192, 38, 211, 0.25)
        );

    border: 1px solid #7c3aed;

    color: white;
}


/* ================= CHAT AREA ================= */

.chat-container {

    flex: 1;

    display: flex;

    flex-direction: column;

    min-width: 0;
}


/* ================= HEADER ================= */

.chat-header {

    padding: 20px;

    text-align: center;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #c026d3
        );

    box-shadow:
        0 0 25px rgba(139, 92, 246, 0.5);
}


.chat-header h2 {

    margin: 0;

    font-size: 24px;
}


.chat-header p {

    margin: 7px 0 0;

    opacity: 0.9;

    font-size: 13px;
}


/* ================= MESSAGES ================= */

.messages {

    flex: 1;

    overflow-y: auto;

    padding: 25px;
}


.message {

    margin: 14px 0;

    padding: 13px 17px;

    border-radius: 14px;

    max-width: 82%;

    line-height: 1.5;

    word-wrap: break-word;

    white-space: pre-wrap;
}


/* BOT */

.bot {

    background: #18132b;

    border: 1px solid #8b5cf6;

    box-shadow:
        0 0 10px rgba(139, 92, 246, 0.15);

    margin-right: auto;
}


/* USER */

.user {

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #9333ea
        );

    margin-left: auto;

    box-shadow:
        0 0 12px rgba(124, 58, 237, 0.3);
}


/* ================= INPUT ================= */

.input-area {

    display: flex;

    padding: 18px;

    gap: 12px;

    border-top: 1px solid #29213f;

    background: #090712;
}


.input-area input {

    flex: 1;

    padding: 15px;

    border-radius: 12px;

    border: 1px solid #8b5cf6;

    background: #080612;

    color: white;

    outline: none;

    font-size: 15px;
}


.input-area input:focus {

    box-shadow:
        0 0 12px rgba(139, 92, 246, 0.5);
}


.input-area button {

    padding: 15px 24px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #c026d3
        );

    color: white;

    cursor: pointer;

    font-weight: bold;

    font-size: 14px;

    transition: 0.3s;
}


.input-area button:hover {

    transform: translateY(-2px);

    box-shadow:
        0 0 18px #8b5cf6;
}


/* ================= SCROLLBAR ================= */

.messages::-webkit-scrollbar,
.chat-list::-webkit-scrollbar {

    width: 6px;
}


.messages::-webkit-scrollbar-track,
.chat-list::-webkit-scrollbar-track {

    background: #080612;
}


.messages::-webkit-scrollbar-thumb,
.chat-list::-webkit-scrollbar-thumb {

    background: #8b5cf6;

    border-radius: 10px;
}


/* ================= MOBILE ================= */

@media (max-width: 700px) {

    body {

        padding: 8px;
    }

    .app-container {

        height: 95vh;

        border-radius: 15px;
    }

    .sidebar {

        width: 190px;
    }

    .chat-header h2 {

        font-size: 19px;
    }

    .messages {

        padding: 15px;
    }

    .message {

        max-width: 90%;
    }

    .input-area {

        padding: 12px;
    }

    .input-area button {

        padding: 12px 16px;
    }
}


@media (max-width: 500px) {

    .sidebar {

        width: 150px;
    }

    .sidebar-header h3 {

        font-size: 15px;
    }

    .chat-item {

        font-size: 12px;
    }

}

</style>

</head>


<body>
    <a href="{{ url_for('dashboard') }}" class="chatbot-back-dashboard">
    ← Back to Dashboard
</a>


<div class="app-container">


    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <div class="sidebar-header">

            <h3>💬 Chat History</h3>

            <button
                class="new-chat"
                onclick="newChat()"
            >
                + New Chat
            </button>

        </div>


        <div
            class="chat-list"
            id="chatList"
        >

            <div style="padding:15px;color:#888;font-size:13px;">
                Loading chats...
            </div>

        </div>

    </div>



    <!-- ================= CHAT ================= -->

    <div class="chat-container">


        <!-- HEADER -->

        <div class="chat-header">

            <h2>
                🤖 AI Portfolio Assistant
            </h2>

            <p>
                Ask me anything
            </p>

        </div>



        <!-- MESSAGES -->

        <div
            class="messages"
            id="messages"
        >

            <div class="message bot">

                👋 Hi! I'm your AI Assistant.

                <br><br>

                You can ask me about:

                <br>

                • Your Portfolio

                <br>

                • AI / ML / Data Science

                <br>

                • Python / Programming

                <br>

                • Projects

                <br>

                • Resume / LinkedIn

                <br>

                • General Questions

            </div>

        </div>



        <!-- INPUT -->

        <div class="input-area">

            <input
                type="text"
                id="userMessage"
                placeholder="Ask something..."
                autocomplete="off"
            >

            <button
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>


    </div>

</div>



<script>


/* ================= CURRENT CHAT ================= */

let currentChatId = null;



/* ================= LOAD CHAT LIST ================= */

async function loadChatList() {

    try {

        const response =
            await fetch("/chat-history");

        if (!response.ok) {

            console.error(
                "Unable to load chat history"
            );

            return;
        }


        const data =
            await response.json();


        const chatList =
            document.getElementById("chatList");


        chatList.innerHTML = "";


        if (
            !data.chats ||
            data.chats.length === 0
        ) {

            chatList.innerHTML = `
                <div style="
                    padding:15px;
                    color:#888;
                    font-size:13px;
                ">
                    No previous chats
                </div>
            `;

            return;
        }


        data.chats.forEach(chat => {

            const item =
                document.createElement("div");


            item.className =
                "chat-item";


            item.dataset.chatId =
                chat.id;


            item.innerText =
                chat.title || "New Chat";


            item.onclick =
                function() {

                    loadChat(chat.id);

                };


            chatList.appendChild(item);

        });

    }

    catch (error) {

        console.error(
            "Chat history error:",
            error
        );

    }

}



/* ================= LOAD OLD CHAT ================= */

async function loadChat(chatId) {

    try {

        const response =
            await fetch(
                `/chat-history/${chatId}`
            );


        if (!response.ok) {

            return;
        }


        const data =
            await response.json();


        currentChatId =
            chatId;


        const messages =
            document.getElementById(
                "messages"
            );


        messages.innerHTML = "";


        data.messages.forEach(item => {

            const message =
                document.createElement("div");


            message.className =
                "message " +
                (
                    item.role === "user"
                    ? "user"
                    : "bot"
                );


            message.innerText =
                item.message;


            messages.appendChild(
                message
            );

        });


        updateActiveChat();


        messages.scrollTop =
            messages.scrollHeight;

    }

    catch (error) {

        console.error(
            "Load chat error:",
            error
        );

    }

}



/* ================= NEW CHAT ================= */

function newChat() {

    currentChatId = null;


    const messages =
        document.getElementById(
            "messages"
        );


    messages.innerHTML = `

        <div class="message bot">

            👋 New chat started!

            <br><br>

            How can I help you?

        </div>

    `;


    document
        .getElementById(
            "userMessage"
        )
        .focus();


    updateActiveChat();

}



/* ================= ACTIVE CHAT ================= */

function updateActiveChat() {

    document
        .querySelectorAll(".chat-item")
        .forEach(item => {

            if (
                String(item.dataset.chatId)
                ===
                String(currentChatId)
            ) {

                item.classList.add(
                    "active"
                );

            }

            else {

                item.classList.remove(
                    "active"
                );

            }

        });

}



/* ================= SEND MESSAGE ================= */

async function sendMessage() {


    const input =
        document.getElementById(
            "userMessage"
        );


    const messages =
        document.getElementById(
            "messages"
        );


    const message =
        input.value.trim();


    if (message === "") {

        return;

    }



    /* USER MESSAGE */

    const userMessage =
        document.createElement("div");


    userMessage.className =
        "message user";


    userMessage.innerText =
        message;


    messages.appendChild(
        userMessage
    );


    input.value = "";


    messages.scrollTop =
        messages.scrollHeight;



    /* THINKING */

    const botMessage =
        document.createElement("div");


    botMessage.className =
        "message bot";


    botMessage.innerText =
        "🤖 Thinking...";


    messages.appendChild(
        botMessage
    );


    messages.scrollTop =
        messages.scrollHeight;



    try {


        const response =
            await fetch(
                "/ai-chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            chat_id:
                                currentChatId

                        })

                }
            );



        if (!response.ok) {

            throw new Error(
                "Server error: " +
                response.status
            );

        }



        const data =
            await response.json();


        /* SAVE CHAT ID */

        if (data.chat_id) {

            currentChatId =
                data.chat_id;

        }


        /* AI RESPONSE */

        botMessage.innerText =
            data.reply ||
            "Sorry, I couldn't generate a response.";


        /* REFRESH CHAT LIST */

        await loadChatList();

        updateActiveChat();

    }


    catch (error) {

        console.error(
            "Chat error:",
            error
        );


        botMessage.innerText =
            "❌ Sorry, something went wrong while connecting to the AI.";

    }



    messages.scrollTop =
        messages.scrollHeight;

}



/* ================= ENTER KEY ================= */

document
    .getElementById(
        "userMessage"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                sendMessage();

            }

        }
    );



/* ================= INITIAL LOAD ================= */

loadChatList();

</script>


</body>

</html>
