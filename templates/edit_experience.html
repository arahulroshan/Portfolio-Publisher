<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Experience</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #080612;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.25);
        }

        h1 {
            text-align: center;
            color: #c084fc;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            color: #ddd;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #4c1d95;
            border-radius: 10px;
            background: #120d20;
            color: white;
            outline: none;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #c026d3;
            box-shadow: 0 0 10px rgba(192, 38, 211, 0.4);
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button,
        .cancel {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        button {
            background: linear-gradient(90deg, #7c3aed, #c026d3);
            color: white;
        }

        .cancel {
            background: #292333;
            color: white;
        }

        button:hover,
        .cancel:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Edit Experience</h1>

        <form method="POST">

            <label>Company</label>
            <input
                type="text"
                name="company"
                value="{{ experience['company'] }}"
                required
            >

            <label>Role</label>
            <input
                type="text"
                name="role"
                value="{{ experience['role'] }}"
                required
            >

            <label>Start Date</label>
            <input
                type="date"
                name="start_date"
                value="{{ experience['start_date'] }}"
                required
            >

            <label>End Date</label>
            <input
                type="date"
                name="end_date"
                value="{{ experience['end_date'] }}"
            >

            <label>Description</label>
            <textarea
                name="description"
                required
            >{{ experience['description'] }}</textarea>

            <div class="buttons">

                <button type="submit">
                    Update Experience
                </button>

                <a href="{{ url_for('experience') }}" class="cancel">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
