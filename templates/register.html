<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Portfolio Publisher</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Register Related Floating Background -->
    <div class="page-float-bg" aria-hidden="true">

        <span class="float-item float-purple">Register</span>
        <span class="float-item float-blue">Username</span>
        <span class="float-item float-pink">Email</span>
        <span class="float-item float-orange">Password</span>
        <span class="float-item float-red">Create Account</span>
        <span class="float-item float-purple">Confirm Password</span>

    </div>

    <div class="auth-container">
        <div class="auth-box">

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join Portfolio Publisher and build your professional portfolio.
            </p>

            <form method="POST">

                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>

                <label>Email</label>
                <input type="email" name="email" placeholder="Enter email" required>

                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>

                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm password" required>

                <button type="submit">Create Account</button>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
