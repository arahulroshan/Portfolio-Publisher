<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Social Links - Portfolio Publisher</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- BACKGROUND EFFECTS -->

    <div class="neon-particles" aria-hidden="true">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <div class="neon-lightning" aria-hidden="true"></div>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            Portfolio Publisher
        </div>

        <div class="nav-links">

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        </div>

    </nav>


    <!-- SOCIAL LINKS -->

    <section class="dashboard social-page">

        <div class="dashboard-header">

            <div class="social-page-icon">
                🔗
            </div>

            <h1>
                Social Links
            </h1>

            <p>
                Connect your professional profiles and online presence.
            </p>

        </div>


        <!-- SOCIAL FORM -->

        <div class="auth-box project-form-box social-form-box">

            <div class="social-form-icon">
                🌐
            </div>

            <h2>
                Manage Social Links
            </h2>

            <p class="social-help-text">
                Add your professional profiles to showcase them on your portfolio.
            </p>


            <form method="POST">


                <!-- LINKEDIN -->

                <div class="social-field">

                    <label>
                        LinkedIn
                    </label>

                    <div class="social-input-wrapper">

                        <span class="social-input-icon">
                            in
                        </span>

                        <input
                            type="url"
                            name="linkedin"
                            value="{{ social['linkedin'] if social else '' }}"
                            placeholder="https://www.linkedin.com/in/your-profile"
                        >

                    </div>

                </div>


                <!-- GITHUB -->

                <div class="social-field">

                    <label>
                        GitHub
                    </label>

                    <div class="social-input-wrapper">

                        <span class="social-input-icon">
                            &lt;/&gt;
                        </span>

                        <input
                            type="url"
                            name="github"
                            value="{{ social['github'] if social else '' }}"
                            placeholder="https://github.com/your-username"
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="social-field">

                    <label>
                        Email
                    </label>

                    <div class="social-input-wrapper">

                        <span class="social-input-icon">
                            @
                        </span>

                        <input
                            type="email"
                            name="email"
                            value="{{ social['email'] if social else '' }}"
                            placeholder="your@email.com"
                        >

                    </div>

                </div>


                <!-- PORTFOLIO -->

                <div class="social-field">

                    <label>
                        Portfolio Website
                    </label>

                    <div class="social-input-wrapper">

                        <span class="social-input-icon">
                            🌐
                        </span>

                        <input
                            type="url"
                            name="portfolio"
                            value="{{ social['portfolio'] if social else '' }}"
                            placeholder="https://yourportfolio.com"
                        >

                    </div>

                </div>


                <!-- SAVE -->

                <button type="submit"
                        class="social-save-btn">

                    <span>⚡</span>
                    SAVE SOCIAL LINKS

                </button>

            </form>

        </div>


        <!-- BACK -->

        <div class="back-dashboard">

            <a href="{{ url_for('dashboard') }}">
                ← Back to Dashboard
            </a>

        </div>

    </section>

</body>

</html>
