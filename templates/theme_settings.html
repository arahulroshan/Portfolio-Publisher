<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customize Portfolio - Portfolio Publisher</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            background:
                radial-gradient(circle at top left, #2e1065, transparent 35%),
                radial-gradient(circle at bottom right, #4c1d95, transparent 30%),
                #080612;
        }

        /* ================= COLOUR PICKER ================= */

        input[type="color"] {
            width: 100%;
            height: 60px;
            padding: 5px;
            border-radius: 12px;
            border: 2px solid #8b5cf6;
            background: #080612;
            cursor: pointer;
            margin-bottom: 20px;
        }

        input[type="color"]:hover {
            box-shadow: 0 0 18px #8b5cf6;
        }

        /* ================= DROPDOWNS ================= */

        select {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            margin-bottom: 25px;
            border-radius: 12px;
            border: 2px solid #8b5cf6;
            background: #080612;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        select:hover {
            box-shadow: 0 0 18px #8b5cf6;
        }

        select:focus {
            outline: none;
            box-shadow: 0 0 20px #8b5cf6;
        }

        select option {
            background: #080612;
            color: white;
        }

        /* ================= LABELS ================= */

        label {
            display: block;
            margin-bottom: 8px;
            color: #d8b4fe;
            font-weight: 600;
            font-size: 15px;
        }

        /* ================= FORM BOX ================= */

        .project-form-box {
            max-width: 650px;
            margin: 30px auto;
        }

        /* ================= SAVE BUTTON ================= */

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                #7c3aed,
                #c026d3
            );
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow:
                0 0 20px #8b5cf6,
                0 0 35px rgba(192, 38, 211, 0.5);
        }

        /* ================= PREVIEW ================= */

        .theme-preview {
            margin-top: 25px;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #8b5cf6;
            text-align: center;
            background: rgba(139, 92, 246, 0.08);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
        }

        .theme-preview h3 {
            color: #c084fc;
            margin-bottom: 10px;
        }

        .theme-preview p {
            color: #cbd5e1;
        }

        /* ================= BACK ================= */

        .back-dashboard {
            text-align: center;
            margin-top: 25px;
        }

        .back-dashboard a {
            color: #c084fc;
            text-decoration: none;
            font-weight: 600;
        }

        .back-dashboard a:hover {
            color: #e9d5ff;
            text-shadow: 0 0 10px #8b5cf6;
        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            Portfolio Publisher
        </div>

        <div class="nav-links">

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        </div>

    </nav>


    <!-- ================= THEME SETTINGS ================= -->

    <section class="dashboard">

        <div class="dashboard-header">

            <h1>
                🎨 Customize Your Portfolio
            </h1>

            <p>
                Choose colours, font and neon background style.
            </p>

        </div>


        <div class="auth-box project-form-box">

            <h2>
                🎨 Portfolio Theme
            </h2>


            <form method="POST">


                <!-- ================= THEME COLOUR ================= -->

                <label>
                    Theme Colour
                </label>

                <input
                    type="color"
                    name="theme_color"
                    value="{{ theme['theme_color'] if theme else '#8b5cf6' }}"
                >


                <!-- ================= BACKGROUND COLOUR ================= -->

                <label>
                    Background Colour
                </label>

                <input
                    type="color"
                    name="background_color"
                    value="{{ theme['background_color'] if theme else '#080612' }}"
                >


                <!-- ================= FONT STYLE ================= -->

                <label>
                    Font Style
                </label>

                <select name="font_style" required>

                    <option value="Outfit"
                        {% if theme and theme["font_style"] == "Outfit" %}selected{% endif %}>
                        Modern - Outfit
                    </option>

                    <option value="Space Grotesk"
                        {% if theme and theme["font_style"] == "Space Grotesk" %}selected{% endif %}>
                        Tech - Space Grotesk
                    </option>

                    <option value="Poppins"
                        {% if theme and theme["font_style"] == "Poppins" %}selected{% endif %}>
                        Stylish - Poppins
                    </option>

                    <option value="Roboto"
                        {% if theme and theme["font_style"] == "Roboto" %}selected{% endif %}>
                        Clean - Roboto
                    </option>

                    <option value="Montserrat"
                        {% if theme and theme["font_style"] == "Montserrat" %}selected{% endif %}>
                        Bold - Montserrat
                    </option>

                </select>


                <!-- ================= NEON BACKGROUND ================= -->

                <label>
                    Neon Background Style
                </label>

                <select name="background_style" required>

                    <option value="purple"
                        {% if theme and theme["background_style"] == "purple" %}selected{% endif %}>
                        💜 Purple Neon
                    </option>

                    <option value="blue"
                        {% if theme and theme["background_style"] == "blue" %}selected{% endif %}>
                        💙 Blue Neon
                    </option>

                    <option value="green"
                        {% if theme and theme["background_style"] == "green" %}selected{% endif %}>
                        💚 Green Neon
                    </option>

                    <option value="pink"
                        {% if theme and theme["background_style"] == "pink" %}selected{% endif %}>
                        🩷 Pink Neon
                    </option>

                    <option value="cyan"
                        {% if theme and theme["background_style"] == "cyan" %}selected{% endif %}>
                        🩵 Cyan Neon
                    </option>

                </select>


                <!-- ================= SAVE ================= -->

                <button type="submit">
                    💾 Save Theme
                </button>


            </form>


            <!-- ================= PREVIEW ================= -->

            <div class="theme-preview">

                <h3>
                    ✨ Your Portfolio Theme
                </h3>

                <p>
                    Your selected colour, font and neon background
                    will be used in your public portfolio.
                </p>

            </div>


        </div>


        <!-- ================= BACK ================= -->

        <div class="back-dashboard">

            <a href="{{ url_for('dashboard') }}">
                ← Back to Dashboard
            </a>

        </div>


    </section>


</body>

</html>
